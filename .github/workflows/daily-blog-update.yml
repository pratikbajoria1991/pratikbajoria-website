name: Daily Blog Update

permissions:
  contents: write

on:
  schedule:
    # Run every day at 08:00 UTC (13:30 IST)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-blog:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate daily AI implementation article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node scripts/generate-daily-blog.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Blog Update Bot"
          git add public/blog-posts.json
          git commit -m "Daily blog post update - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

  deploy:
    needs: update-blog
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=pratikbajoria-com --branch=main
