name: Daily Blog Update

permissions:
  contents: write

on:
  schedule:
    # Mon–Fri 08:00 UTC (13:30 IST) — weekday cadence to keep quality high
    - cron: '0 8 * * 1-5'
    # Backup Mon–Fri 11:45 UTC (17:15 IST): GitHub often skips or delays scheduled runs.
    # The generator publishes at most one topic-bank post per IST date, so this is a no-op
    # when the 13:30 run already published.
    - cron: '45 11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-blog-update
  cancel-in-progress: false

jobs:
  update-blog:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      base: ${{ steps.push.outputs.base }}
      head: ${{ steps.push.outputs.head }}
      wait_url: ${{ steps.push.outputs.wait_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily article from the sourced topic bank
        run: node scripts/generate-daily-blog.js

      - name: Test (topic validation + content similarity)
        run: npm test

      - name: Commit and push changes
        id: push
        run: |
          # The worker server-renders /blog/{slug} from blog-posts.json; the sitemap must list it too.
          # Stage everything the generator may touch under public/ (JSON, sitemap, any SSR HTML).
          git add public/blog-posts.json public/sitemap.xml public/blog
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.name="Blog Update Bot" -c user.email="action@github.com" \
            commit -m "Daily blog post update - $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git pull --rebase origin main
          base=$(git rev-parse origin/main)
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          new=$(git diff --name-only "$base" HEAD -- public/blog | grep -E '\.html$' | head -1 || true)
          if [ -n "$new" ]; then p="${new#public/}"; echo "wait_url=https://pratikbajoria.com/${p%.html}" >> "$GITHUB_OUTPUT"; fi

  # Pushes made with GITHUB_TOKEN don't trigger purge-cache.yml's push event, so call it here.
  purge-cache:
    needs: update-blog
    if: needs.update-blog.outputs.pushed == 'true'
    uses: ./.github/workflows/purge-cache.yml
    with:
      base: ${{ needs.update-blog.outputs.base }}
      head: ${{ needs.update-blog.outputs.head }}
      wait_url: ${{ needs.update-blog.outputs.wait_url }}
    secrets: inherit

  # No deploy job: Cloudflare Pages is git-connected to main and auto-deploys on every push.
  # The old wrangler Direct Upload job failed on an invalid CLOUDFLARE_API_TOKEN secret.
