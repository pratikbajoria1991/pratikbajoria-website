<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" role="img" aria-labelledby="t d" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
<title id="t">90-day AI pilot roadmap for a CA firm in India</title>
<desc id="d">Three phases. Days 1 to 30: choose and baseline the workflow, agree client-data rules and sign a pilot charter. Days 31 to 60: run AI in parallel with 100 percent review, an exception log and a weekly review. Days 61 to 90: prove at normal volume, compare with the baseline and decide to keep, change or stop. Guardrails: DPDP Act 2023 security safeguards, NFRA July 2026 tool validation before live audit use, and ICAI AICA Level 1 training of 3 days and 18 CPE hours.</desc>
<rect width="900" height="656" fill="#f4f0e8"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">90-day AI pilot roadmap for a CA firm in India</tspan></text><text x="40" y="82" font-size="15" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">One workflow, one owner, a baseline before any tool, and a written decision on day 90.</tspan></text><rect x="40" y="110" width="264" height="350" rx="12" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="40" y="110" width="264" height="58" rx="12" fill="#1f2523"/><rect x="40" y="150" width="264" height="18" fill="#1f2523"/><text x="56" y="135" font-size="13" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="56" dy="0">Days 1–30</tspan></text><text x="56" y="156" font-size="17" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="56" dy="0">Choose and baseline</tspan></text><circle cx="60" cy="189" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="72" y="194" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="72" dy="0">Score the shortlist: volume,</tspan><tspan x="72" dy="18">written rules, data</tspan><tspan x="72" dy="18">sensitivity, reviewability,</tspan><tspan x="72" dy="18">cost of an error, ownership</tspan></text><circle cx="60" cy="273" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="72" y="278" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="72" dy="0">Log 20+ real items as they run</tspan><tspan x="72" dy="18">today: time, returns at review,</tspan><tspan x="72" dy="18">error types</tspan></text><circle cx="60" cy="339" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="72" y="344" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="72" dy="0">Agree one page of client-data</tspan><tspan x="72" dy="18">rules; firm-controlled business</tspan><tspan x="72" dy="18">accounts only</tspan></text><circle cx="60" cy="405" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="72" y="410" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="72" dy="0">Sign a pilot charter with</tspan><tspan x="72" dy="18">success thresholds and stop</tspan><tspan x="72" dy="18">conditions</tspan></text><path d="M305 275 l12 0" stroke="#1f2523" stroke-width="2"/><path d="M313 270 l6 5 -6 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="318" y="110" width="264" height="350" rx="12" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="318" y="110" width="264" height="58" rx="12" fill="#1f2523"/><rect x="318" y="150" width="264" height="18" fill="#1f2523"/><text x="334" y="135" font-size="13" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="334" dy="0">Days 31–60</tspan></text><text x="334" y="156" font-size="17" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="334" dy="0">Run in parallel</tspan></text><circle cx="338" cy="189" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="350" y="194" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="350" dy="0">AI drafts alongside the normal</tspan><tspan x="350" dy="18">process; 100% of output is</tspan><tspan x="350" dy="18">reviewed</tspan></text><circle cx="338" cy="255" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="350" y="260" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="350" dy="0">Keep an exception log of every</tspan><tspan x="350" dy="18">correction and why it mattered</tspan></text><circle cx="338" cy="303" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="350" y="308" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="350" dy="0">Hold a 20-minute weekly review</tspan><tspan x="350" dy="18">of the log, not anecdotes</tspan></text><circle cx="338" cy="351" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="350" y="356" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="350" dy="0">Improve inputs and</tspan><tspan x="350" dy="18">instructions; do not widen the</tspan><tspan x="350" dy="18">scope</tspan></text><path d="M583 275 l12 0" stroke="#1f2523" stroke-width="2"/><path d="M591 270 l6 5 -6 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="596" y="110" width="264" height="350" rx="12" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="596" y="110" width="264" height="58" rx="12" fill="#1f2523"/><rect x="596" y="150" width="264" height="18" fill="#1f2523"/><text x="612" y="135" font-size="13" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="612" dy="0">Days 61–90</tspan></text><text x="612" y="156" font-size="17" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="612" dy="0">Prove and decide</tspan></text><circle cx="616" cy="189" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="628" y="194" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="628" dy="0">Normal volume: the tool drafts,</tspan><tspan x="628" dy="18">a named reviewer signs off</tspan></text><circle cx="616" cy="237" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="628" y="242" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="628" dy="0">Compare reviewer time, returns</tspan><tspan x="628" dy="18">and turnaround with the</tspan><tspan x="628" dy="18">baseline</tspan></text><circle cx="616" cy="303" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="628" y="308" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="628" dy="0">Decide in writing: keep, change</tspan><tspan x="628" dy="18">or stop</tspan></text><circle cx="616" cy="351" r="4" fill="#c5d96b" stroke="#1f2523" stroke-width="1"/><text x="628" y="356" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="628" dy="0">If kept: write the SOP and add</tspan><tspan x="628" dy="18">the tool to the approved</tspan><tspan x="628" dy="18">register</tspan></text><rect x="40" y="476" width="820" height="118" rx="12" fill="#e9efcd" stroke="#c8c6bb"/><text x="58" y="502" font-size="15" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="58" dy="0">Guardrails that apply throughout</tspan></text><text x="58" y="526" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="58" dy="0">• DPDP Act, 2023: reasonable security safeguards for personal data, including when a vendor processes it for you.</tspan></text><text x="58" y="547" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="58" dy="0">• NFRA (July 2026): validate and approve a tool before using it on a live audit engagement; the auditor stays responsible.</tspan></text><text x="58" y="568" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="58" dy="0">• ICAI AICA Level 1: 3 days and 18 structured CPE hours, a practical starting point for the pilot owner.</tspan></text><text x="40" y="614" font-size="11" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">Sources: pratikbajoria.com 90-day pilot method; Digital Personal Data Protection Act, 2023 (MeitY); NFRA Staff Series on Technology in Audit 01 (July</tspan><tspan x="40" dy="15">2026); ICAI AICA Level 1 reference document.</tspan></text>
</svg>
