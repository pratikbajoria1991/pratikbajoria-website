<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-labelledby="t d" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
<title id="t">AI adoption steps for Indian SMEs</title>
<desc id="d">Context: India has more than 60 million MSMEs, contributing about 30 percent of GDP and about half of exports, with only 19 percent of MSME credit demand met by formal sources. Step 1: find your data phase, from phase 0 paper records, phase 1 spreadsheets and Tally or Zoho, phase 2 APIs and cloud platforms, to phase 3 fully integrated real-time systems. Step 2: score each use case on impact (business value, strategic alignment, people affected) and feasibility (operational readiness, cost to deploy). Step 3: start with high-impact, easy use cases and add more in phases. Microenterprises should begin with free or low-cost tools, AI-as-a-service and mobile apps; 85 percent of Indians have a mobile phone and 60 percent internet access. Source: WEF, IndiaAI, PSA playbook, August 2025.</desc>
<rect width="900" height="650" fill="#f4f0e8"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">AI adoption steps for Indian SMEs</tspan></text><text x="40" y="82" font-size="15" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">Find your data phase, score use cases on impact and feasibility, then roll out in phases.</tspan></text><rect x="40" y="100" width="196" height="70" rx="10" fill="#1f2523"/><text x="54" y="134" font-size="24" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="54" dy="0">60m+</tspan></text><text x="54" y="156" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="54" dy="0">MSMEs in India</tspan></text><rect x="248" y="100" width="196" height="70" rx="10" fill="#1f2523"/><text x="262" y="134" font-size="24" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="262" dy="0">~30%</tspan></text><text x="262" y="156" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="262" dy="0">of India’s GDP</tspan></text><rect x="456" y="100" width="196" height="70" rx="10" fill="#1f2523"/><text x="470" y="134" font-size="24" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="470" dy="0">~half</tspan></text><text x="470" y="156" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="470" dy="0">of India’s exports</tspan></text><rect x="664" y="100" width="196" height="70" rx="10" fill="#1f2523"/><text x="678" y="134" font-size="24" font-weight="700" fill="#c5d96b" text-anchor="start"><tspan x="678" dy="0">19%</tspan></text><text x="678" y="156" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="678" dy="0">of MSME credit met formally</tspan></text><text x="40" y="206" font-size="17" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">Step 1. Find your data phase</tspan></text><rect x="40" y="222" width="196" height="118" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="40" y="222" width="196" height="8" rx="4" fill="#c5d96b" opacity="0.4"/><text x="52" y="252" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">Phase 0</tspan></text><text x="52" y="272" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">Paper ledgers, manual logs</tspan></text><text x="52" y="293" font-size="12" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="52" dy="0">AI use: Look back at trends</tspan><tspan x="52" dy="15">in historical data</tspan></text><rect x="248" y="222" width="196" height="118" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="248" y="222" width="196" height="8" rx="4" fill="#c5d96b" opacity="0.6000000000000001"/><text x="260" y="252" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="260" dy="0">Phase 1</tspan></text><text x="260" y="272" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="260" dy="0">Spreadsheets, Tally, Zoho,</tspan><tspan x="260" dy="15">basic ERP or CRM</tspan></text><text x="260" y="308" font-size="12" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="260" dy="0">AI use: Basic trends and</tspan><tspan x="260" dy="15">automated reporting</tspan></text><rect x="456" y="222" width="196" height="118" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="456" y="222" width="196" height="8" rx="4" fill="#c5d96b" opacity="0.8"/><text x="468" y="252" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="468" dy="0">Phase 2</tspan></text><text x="468" y="272" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="468" dy="0">APIs, sensors, QR tools,</tspan><tspan x="468" dy="15">cloud platforms</tspan></text><text x="468" y="308" font-size="12" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="468" dy="0">AI use: Predictive planning</tspan><tspan x="468" dy="15">(inventory, maintenance)</tspan></text><rect x="664" y="222" width="196" height="118" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><rect x="664" y="222" width="196" height="8" rx="4" fill="#c5d96b" opacity="1.0"/><text x="676" y="252" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="676" dy="0">Phase 3</tspan></text><text x="676" y="272" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="676" dy="0">Fully integrated, real-time</tspan><tspan x="676" dy="15">systems</tspan></text><text x="676" y="308" font-size="12" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="676" dy="0">AI use: Prescriptive,</tspan><tspan x="676" dy="15">automated workflows</tspan></text><text x="40" y="376" font-size="17" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">Step 2. Score each use case</tspan></text><rect x="40" y="390" width="404" height="84" rx="10" fill="#e9efcd" stroke="#1f2523"/><text x="56" y="414" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="56" dy="0">Impact</tspan></text><text x="56" y="436" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="56" dy="0">Business value (revenue or cost), strategic alignment, and</tspan><tspan x="56" dy="16">the number of people affected.</tspan></text><rect x="456" y="390" width="404" height="84" rx="10" fill="#e9efcd" stroke="#1f2523"/><text x="472" y="414" font-size="14" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="472" dy="0">Feasibility</tspan></text><text x="472" y="436" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="472" dy="0">Operational readiness (infrastructure and workforce</tspan><tspan x="472" dy="16">capability) and cost to deploy.</tspan></text><text x="40" y="510" font-size="17" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">Step 3. Start where impact is high and implementation is easy; add use cases in phases</tspan></text><rect x="40" y="526" width="820" height="62" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><text x="56" y="550" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="56" dy="0">Microenterprises: begin with free or low-cost tools, AI-as-a-service and mobile apps (85% of Indians have a mobile</tspan><tspan x="56" dy="18">phone, 60% internet access) before any custom build.</tspan></text><text x="40" y="616" font-size="11" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">Source: World Economic Forum with IndiaAI (MeitY), the Office of the Principal Scientific Adviser and BCG X, “Transforming Small Businesses: An AI</tspan><tspan x="40" dy="15">Playbook for India’s SMEs”, August 2025.</tspan></text>
</svg>
