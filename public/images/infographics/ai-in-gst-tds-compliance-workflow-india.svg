<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="t d" font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
<title id="t">Where AI fits in the GST and TDS compliance workflow in India</title>
<desc id="d">GST lane: suppliers file invoices in GSTR-1, IFF or GSTR-1A; the recipient accepts, rejects or keeps them pending in IMS (no action means deemed accepted); a draft GSTR-2B is generated on the 14th of the next month and must be recomputed if IMS actions change; AI can clean exports, match invoices and list exceptions; a reviewer signs off input tax credit in GSTR-3B, which since 1 January 2022 is limited to the amount in GSTR-2B under section 16(2)(aa). TDS lane: Form 26AS and the Annual Information Statement (Form 168) are matched by AI against certificates and ledgers to produce a differences list; people follow up with deductors and decide what is claimed.</desc>
<rect width="900" height="660" fill="#f4f0e8"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">Where AI fits in the GST and TDS compliance workflow</tspan></text><text x="40" y="82" font-size="15" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">AI drafts, matches and flags. People decide what is claimed, rejected and filed.</tspan></text><rect x="40" y="100" width="18" height="18" rx="4" fill="#e9efcd" stroke="#1f2523"/><text x="66" y="114" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="66" dy="0">AI can assist</tspan></text><rect x="170" y="100" width="18" height="18" rx="4" fill="#1f2523"/><text x="196" y="114" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="196" dy="0">Human decision or sign-off</tspan></text><rect x="390" y="100" width="18" height="18" rx="4" fill="#ffffff" stroke="#c8c6bb"/><text x="416" y="114" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="416" dy="0">Portal step</tspan></text><text x="40" y="160" font-size="17" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">GST input tax credit, every month</tspan></text><rect x="40" y="176" width="150" height="150" rx="10" fill="#ffffff" stroke="#c8c6bb"/><text x="52" y="198" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">1. Supplier files</tspan></text><text x="52" y="218" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">Invoices saved in</tspan><tspan x="52" dy="15">GSTR-1, IFF or GSTR-1A</tspan><tspan x="52" dy="15">appear in the</tspan><tspan x="52" dy="15">recipient’s IMS.</tspan></text><path d="M191 251.0 L202 251.0" stroke="#1f2523" stroke-width="2"/><path d="M200 246.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="208" y="176" width="150" height="150" rx="10" fill="#1f2523" stroke="#1f2523"/><text x="220" y="198" font-size="13" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="220" dy="0">2. IMS action</tspan></text><text x="220" y="218" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="220" dy="0">Accept, reject or keep</tspan><tspan x="220" dy="15">pending. No action =</tspan><tspan x="220" dy="15">deemed accepted. AI</tspan><tspan x="220" dy="15">can pre-match to the</tspan><tspan x="220" dy="15">purchase register.</tspan></text><path d="M359 251.0 L370 251.0" stroke="#1f2523" stroke-width="2"/><path d="M368 246.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="376" y="176" width="150" height="150" rx="10" fill="#ffffff" stroke="#c8c6bb"/><text x="388" y="198" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="388" dy="0">3. Draft GSTR-2B</tspan></text><text x="388" y="218" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="388" dy="0">Generated on the 14th</tspan><tspan x="388" dy="15">of the next month.</tspan><tspan x="388" dy="15">Recompute if IMS</tspan><tspan x="388" dy="15">actions change after</tspan><tspan x="388" dy="15">that.</tspan></text><path d="M527 251.0 L538 251.0" stroke="#1f2523" stroke-width="2"/><path d="M536 246.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="544" y="176" width="150" height="150" rx="10" fill="#e9efcd" stroke="#1f2523"/><text x="556" y="198" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="556" dy="0">4. Reconcile</tspan></text><text x="556" y="218" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="556" dy="0">AI cleans exports,</tspan><tspan x="556" dy="15">matches on GSTIN,</tspan><tspan x="556" dy="15">invoice no. and</tspan><tspan x="556" dy="15">amount, and lists</tspan><tspan x="556" dy="15">exceptions.</tspan></text><path d="M695 251.0 L706 251.0" stroke="#1f2523" stroke-width="2"/><path d="M704 246.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="712" y="176" width="150" height="150" rx="10" fill="#1f2523" stroke="#1f2523"/><text x="724" y="198" font-size="13" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="724" dy="0">5. Claim in GSTR-3B</tspan></text><text x="724" y="218" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="724" dy="0">Reviewer signs off</tspan><tspan x="724" dy="15">ITC. Credit only up to</tspan><tspan x="724" dy="15">GSTR-2B: s.16(2)(aa),</tspan><tspan x="724" dy="15">from 1 Jan 2022.</tspan></text><text x="40" y="370" font-size="17" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="40" dy="0">TDS credits and the Annual Information Statement</tspan></text><rect x="40" y="386" width="196" height="124" rx="10" fill="#ffffff" stroke="#c8c6bb"/><text x="52" y="408" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">1. Statements</tspan></text><text x="52" y="428" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="52" dy="0">Form 26AS and the AIS (Form</tspan><tspan x="52" dy="15">No. 168 under the Income-tax</tspan><tspan x="52" dy="15">Act, 2025).</tspan></text><path d="M237 448.0 L242 448.0" stroke="#1f2523" stroke-width="2"/><path d="M240 443.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="248" y="386" width="196" height="124" rx="10" fill="#e9efcd" stroke="#1f2523"/><text x="260" y="408" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="260" dy="0">2. Extract and match</tspan></text><text x="260" y="428" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="260" dy="0">AI reads certificates and</tspan><tspan x="260" dy="15">ledgers and matches them to</tspan><tspan x="260" dy="15">the statement.</tspan></text><path d="M445 448.0 L450 448.0" stroke="#1f2523" stroke-width="2"/><path d="M448 443.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="456" y="386" width="196" height="124" rx="10" fill="#e9efcd" stroke="#1f2523"/><text x="468" y="408" font-size="13" font-weight="700" fill="#1f2523" text-anchor="start"><tspan x="468" dy="0">3. Differences list</tspan></text><text x="468" y="428" font-size="12" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="468" dy="0">Missing, short or wrong-PAN</tspan><tspan x="468" dy="15">credits, grouped by deductor.</tspan></text><path d="M653 448.0 L658 448.0" stroke="#1f2523" stroke-width="2"/><path d="M656 443.0 l8 5 -8 5" fill="none" stroke="#1f2523" stroke-width="2"/><rect x="664" y="386" width="196" height="124" rx="10" fill="#1f2523" stroke="#1f2523"/><text x="676" y="408" font-size="13" font-weight="700" fill="#f5f2eb" text-anchor="start"><tspan x="676" dy="0">4. Follow-up and claim</tspan></text><text x="676" y="428" font-size="12" font-weight="400" fill="#f5f2eb" text-anchor="start"><tspan x="676" dy="0">Chase deductors for</tspan><tspan x="676" dy="15">corrections; decide what is</tspan><tspan x="676" dy="15">claimed in the return.</tspan></text><rect x="40" y="530" width="820" height="70" rx="10" fill="#fbf9f4" stroke="#c8c6bb"/><text x="56" y="554" font-size="13" font-weight="400" fill="#1f2523" text-anchor="start"><tspan x="56" dy="0">Keep with people: eligibility and blocked credits, IMS rejections (they affect the supplier), fuzzy matches, the final</tspan><tspan x="56" dy="18">ITC figure, and anything that leaves the firm.</tspan></text><text x="40" y="630" font-size="11" font-weight="400" fill="#5c625b" text-anchor="start"><tspan x="40" dy="0">Sources: CBIC Circular No. 193/05/2023-GST; GSTN advisory on the Invoice Management System; Income Tax Department, Form No. 168 FAQs.</tspan></text>
</svg>
